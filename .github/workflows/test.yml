name: Get ONS articles

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron:  '35 4 * * *'
    
permissions:
  contents: write

jobs:
  build-json:
    runs-on: ubuntu-latest
    if: ${{ github.repository != 'simonw/shot-scraper-template' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.11
      uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566 # v3
      with:
        python-version: "3.11"
    - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
      name: Configure pip caching
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Fetch articles JSON
      run: |
        curl -L "https://raw.githubusercontent.com/ONSdigital/get-ons-vis-screenshots/refs/heads/main/articles-and-dvcs.json" -o articles-and-dvcs.json
    - name: Install notebook runner
      run: |
        pip install jupyter
    - name: Run notebook
      run: |
        python -m jupyter nbconvert --to notebook --execute onsvisualjournalism.ipynb --output onsvisualjournalism-output.ipynb --output-dir /tmp
    - name: Commit and push
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git stash
        git pull --rebase origin main
        git stash pop
        git add -A
        timestamp=$(date -u)
        git commit -m "${timestamp}" || exit 0
        git push