name: Get ONS articles

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron:  '35 4 * * *'
    
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-json:
    runs-on: ubuntu-latest
    if: ${{ github.repository != 'simonw/shot-scraper-template' }}
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    - name: Set up Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"
    - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
      name: Configure pip caching
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Install notebook runner
      run: |
        pip install jupyter
    - name: Run notebook
      run: |
        python -m jupyter nbconvert --to notebook --execute catalogue.ipynb --ExecutePreprocessor.timeout=-1 --output catalogue-output.ipynb --output-dir /tmp
    - name: Commit and push
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -- articles-and-dvcs.json data.json discovery-state.json
        if git diff --cached --quiet; then
          exit 0
        fi
        git stash push -m "Generated catalogue data"
        git pull --rebase origin main
        git stash pop
        git add -- articles-and-dvcs.json data.json discovery-state.json
        timestamp=$(date -u)
        git commit -m "${timestamp}"
        git push