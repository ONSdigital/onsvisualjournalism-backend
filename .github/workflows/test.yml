name: Get ONS articles

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron:  '35 4 * * *'
    
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-json:
    runs-on: ubuntu-latest
    if: ${{ github.repository != 'simonw/shot-scraper-template' }}
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    - name: Set up Python 3.11
      uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566 # v3
      with:
        python-version: "3.11"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      name: Configure pip caching
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Check screenshot settings
      id: screenshots
      run: |
        python - <<'PY'
        import json
        import os
        from ons_discovery import validate_config

        with open('config.json', encoding='utf-8') as source:
            config = validate_config(json.load(source))
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            output.write(f"enabled={str(config['screenshots']['mode'] != 'off').lower()}\n")
        PY
    - name: Install screenshot browser
      if: steps.screenshots.outputs.enabled == 'true'
      run: python -m playwright install --with-deps chromium
    - name: Run pipeline
      id: pipeline
      run: |
        python -u catalogue.py
    - name: Commit and push
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        generated=()
        for file in articles-and-dvcs.json data.json discovery-state.json; do
          if [ -f "$file" ]; then
            generated+=("$file")
          fi
        done
        if [ -f screenshots/index.json ]; then
          generated+=("screenshots/index.json")
          while IFS= read -r -d '' file; do
            generated+=("$file")
          done < <(find screenshots -maxdepth 1 -type f -name '*.jpg' -print0)
        fi
        if [ ${#generated[@]} -eq 0 ]; then
          exit 0
        fi
        git add -- "${generated[@]}"
        if git diff --cached --quiet; then
          exit 0
        fi
        git stash push -m "Generated catalogue data"
        git pull --rebase origin main
        git stash pop
        git add -- "${generated[@]}"
        timestamp=$(date -u)
        git commit -m "${timestamp}"
        git push